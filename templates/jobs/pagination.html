{% load i18n %}{% if page.has_other_pages %}<nav class="mt-5" aria-label="{% trans 'Pagination' %}"><ul class="pagination">{% if page.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page.previous_page_number }}">{% trans "Previous" %}</a></li>{% endif %}<li class="page-item active"><span class="page-link">{{ page.number }}</span></li>{% if page.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page.next_page_number }}">{% trans "Next" %}</a></li>{% endif %}</ul></nav>{% endif %}
